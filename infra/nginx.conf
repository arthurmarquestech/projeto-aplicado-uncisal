# Nginx — reverse proxy + redirecionamento HTTP→HTTPS
# Substitua SEU_IP_PUBLICO pelo IP da VM (ou pelo domínio, se houver).
# Após obter o certificado com Certbot, este arquivo pode ser mesclado
# com o que o Certbot gerar em /etc/nginx/sites-available/

# Redireciona todo HTTP para HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name SEU_IP_PUBLICO;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name SEU_IP_PUBLICO;

    # Certificados gerados pelo Certbot (ajuste os caminhos se necessário)
    ssl_certificate     /etc/letsencrypt/live/SEU_IP_PUBLICO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SEU_IP_PUBLICO/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Endurecimento TLS básico (nota A / trusted)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Cabeçalhos de segurança no edge
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # App Node escuta apenas em localhost:3000
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
