# Trecho opcional para Post-Quantum Cryptography (PQC) no Nginx.
# Requer OpenSSL/Nginx com suporte a grupos híbridos (ex.: X25519MLKEM768).
# Verifique com: nginx -V  e  openssl version
#
# Inclua estas diretivas no bloco `server` HTTPS (após ssl_protocols):

# Grupos de troca de chaves incluindo PQC híbrido (quando disponível no OpenSSL do SO)
ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1;

# Em builds mais novos do OpenSSL 3.5+ / Nginx com suporte:
# ssl_conf_command Groups X25519MLKEM768:X25519:P-256;

# Teste PQC:
#   https://www.digicert.com/pqc-checker
# Teste certificado (acesso por IP):
#   https://www.ssl.org/
